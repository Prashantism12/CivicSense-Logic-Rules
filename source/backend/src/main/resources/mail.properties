# ─────────────────────────────────────────────────────────────
#  CivicSense e-mail (OTP, password-reset, complaint updates)
# ─────────────────────────────────────────────────────────────
#  1. Use a Gmail account with 2-Step Verification enabled.
#  2. Create an "App password" (Google Account > Security > App passwords).
#  3. Paste the 16-character code below (spaces are fine).
#
#  You can ALSO override these without editing the file by setting the
#  environment variables CIVICSENSE_MAIL_USER / CIVICSENSE_MAIL_PASSWORD
#  (or JVM options -Dcivicsense.mail.user=... -Dcivicsense.mail.password=...).
#
#  NOTE: the previous version of the project had this password hard-coded in
#  Java source. Because it was shared, please REVOKE it in your Google account
#  and create a fresh one.
mail.host=smtp.gmail.com
mail.port=587
mail.user=CHANGE_ME
mail.password=CHANGE_ME
mail.from.name=HDMC CivicSense
# Base URL used in e-mail links
app.base.url=http://localhost:8080/CivicSense

# Who must enter an e-mailed OTP after the password step at sign-in?
# Comma separated: CITIZEN, EMPLOYEE, ADMIN.  Default CITIZEN (the seeded employee/admin demo
# accounts use fake @demo.com addresses that can never receive mail).
# New citizens ALWAYS verify their e-mail with an OTP when they register.
login.otp.roles=CITIZEN
